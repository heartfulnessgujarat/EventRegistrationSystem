
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Registration — MERS V6A</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { width: 100%; max-width: 450px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
    
    /* Container for the injected HTML banner */
    .event-banner-injected img { width: 100%; display: block; height: auto; }
    
    .header-img { width: 100%; height: 160px; object-fit: cover; background: #e0e0e0; display: block; }
    .header-content { padding: 15px; border-bottom: 1px solid #eee; }
    .header-content h2 { color: #1a237e; margin: 0; font-size: 18px; line-height: 1.3; }
    .header-content p { color: #666; font-size: 12px; margin: 5px 0 0; }
    .content-body { padding: 25px; }
    .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; border-left: 5px solid #1a237e; font-size: 13px; line-height: 1.6; }
    .question { font-weight: bold; color: #d32f2f; margin-bottom: 20px; font-size: 15px; }
    .btn-row { display: flex; gap: 10px; justify-content: center; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s; }
    .btn-yes { background: #d32f2f; color: white; }
    .btn-no { background: #4caf50; color: white; }
    .full-msg { padding: 40px 20px; }
    .icon { font-size: 50px; margin-bottom: 15px; }
    .timer-text { font-size: 12px; color: #999; margin-top: 20px; font-weight: bold; }
    #loader { color: #1a237e; font-weight: bold; padding: 40px; }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <div id="loader">Fetching Details...</div>

  <div id="confirm-ui" style="display:none;">
    <!-- Container for injected HTML storage banner -->
    <div id="banner-container"></div>
    
    <!-- Fallback image hidden by default -->
    <img id="event-img" class="header-img" src="" alt="Event Banner" style="display:none;">
    
    <div class="header-content">
      <h2 id="event-title">Loading...</h2>
      <p id="event-subtitle">Loading...</p>
    </div>
    <div class="content-body">

      
      <div class="info-box" id="user-info"></div>
      <p class="question">Are you sure, you want to delete this reg?</p>
      <div class="btn-row">
        <button class="btn btn-yes" onclick="handleResponse('YES')">Yes</button>
        <button class="btn btn-no" onclick="handleResponse('NO')">No</button>
      </div>
    </div>
  </div>

  <div id="status-ui" class="full-msg" style="display:none;">
    <div class="icon" id="status-icon"></div>
    <h2 id="status-title"></h2>
    <p id="status-desc"></p>
    <p class="timer-text">This window will close in <span id="countdown">15</span> seconds.</p>
  </div>
</div>

<script>
  const firebaseConfig = { databaseURL: "https://ferrari-reg-2026-default-rtdb.asia-southeast1.firebasedatabase.app" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  async function recalculateAvailableSeatsForCancellation(targetEventId) {
    const [configSnap, maleRoomSnap, femaleRoomSnap, maleDormSnap, femaleDormSnap] = await Promise.all([
      db.ref(`config/eventConfig/${targetEventId}`).once('value'),
      db.ref(`counters/confirmed_counters/room_male/${targetEventId}`).once('value'),
      db.ref(`counters/confirmed_counters/room_female/${targetEventId}`).once('value'),
      db.ref(`counters/confirmed_counters/dorm_male/${targetEventId}`).once('value'),
      db.ref(`counters/confirmed_counters/dorm_female/${targetEventId}`).once('value')
    ]);
    const cfg = configSnap.val() || {};
    const personsPerRoom = Number(cfg.persons_per_room) || 2;
    const vipRooms = String(cfg.VIP_Gate_Entry || "").trim().toUpperCase() === "YES"
      ? Math.max(0, Number(cfg.Room_Reserved_for_VIP) || 0) : 0;
    const maleFacilitatorRooms = Math.ceil(Math.max(0, Number(cfg.total_male_facilitators) || 0) / personsPerRoom);
    const femaleFacilitatorRooms = Math.ceil(Math.max(0, Number(cfg.total_female_facilitators) || 0) / personsPerRoom);
    const roomCapacity = Math.max(0, (Number(cfg.room_capacity) || 0) - vipRooms - maleFacilitatorRooms - femaleFacilitatorRooms);
    if (personsPerRoom <= 0) throw new Error('Invalid persons_per_room in Event_Config.');
    const maleRoom = Math.max(0, Number(maleRoomSnap.val()) || 0);
    const femaleRoom = Math.max(0, Number(femaleRoomSnap.val()) || 0);
    const maleDorm = Math.max(0, Number(maleDormSnap.val()) || 0);
    const femaleDorm = Math.max(0, Number(femaleDormSnap.val()) || 0);
    const available = {
      room_male: Math.max(0, (Math.max(0, roomCapacity - Math.ceil(femaleRoom / personsPerRoom)) * personsPerRoom) - maleRoom),
      room_female: Math.max(0, (Math.max(0, roomCapacity - Math.ceil(maleRoom / personsPerRoom)) * personsPerRoom) - femaleRoom),
      dorm_male: Math.max(0, (Math.max(0, (Number(cfg.male_dorm_capacity) || 0) * (Number(cfg.male_dorm_persons_per_dorm) || 0)) - maleDorm)),
      dorm_female: Math.max(0, (Math.max(0, (Number(cfg.female_dorm_capacity) || 0) * (Number(cfg.female_dorm_persons_per_dorm) || 0)) - femaleDorm))
    };
    const updates = {};
    Object.entries(available).forEach(([key, value]) => updates[`counters/available_seats/${key}/${targetEventId}`] = value);
    await db.ref().update(updates);
    console.log('MERS cancellation: available-seat counters recalculated', available);
    return available;
  }

  console.log("MERS DEBUG: V6A CANCELLATION + CASCADING ACCOMMODATION QUEUE ENGINE ACTIVE");

  const urlParams = new URLSearchParams(window.location.search);
  const eventId = urlParams.get('id') || "EVT001";
  const regId = urlParams.get('regId');

  window.onload = async () => {
    if (!regId) {
      showFinalStatus("Error", "Invalid link.", "⚠️");
      return;
    }

    try {
      // 1. Parallel Fetch: Config, Registration, and HTML Storage Banner
      const [eventSnap, bannerSnap, activeSnap] = await Promise.all([
        db.ref(`config/eventConfig/${eventId}`).once('value'),
        db.ref(`htmlStorage/${eventId}/banner`).once('value'),
        db.ref(`registrations/${eventId}/${regId}`).once('value')
      ]);

      const eventConfig = eventSnap.val() || {};
      const bannerHtml = bannerSnap.val();
      const activeData = activeSnap.val();

      // 2. Setup Headers
      document.getElementById('event-title').innerText = eventConfig.title || "Event Registration";
      document.getElementById('event-subtitle').innerHTML = eventConfig.subtitle || "Registration Management";

      // 3. Inject Banner from htmlStorage
      if (bannerHtml) {
        document.getElementById('banner-container').innerHTML = bannerHtml;
        document.getElementById('banner-container').style.display = 'block';
      } else if (eventConfig.event_title_image_url) {
        // Fallback to direct image if HTML storage is empty
        const fallbackImg = document.getElementById('event-img');
        fallbackImg.src = eventConfig.event_title_image_url;
        fallbackImg.style.display = 'block';
      }

      // 4. Routing
      if (activeData) {
        showConfirmationUI(activeData);
      } else {
        const deletedSnap = await db.ref(`deleted_registrations/${eventId}/${regId}`).once('value');
        const deletedData = deletedSnap.val();

        if (deletedData) {
          showFinalStatus("Already Cancelled", 
            `You have already deleted your reg on ${deletedData.cancelled_at}.`, "ℹ️");
        } else {
          showFinalStatus("Not Found", "We couldn't find this record.", "❓");
        }
      }
    } catch (e) {
      console.error("MERS: Initialization Error", e);
      showFinalStatus("Error", "Connection error.", "❌");
    }
  };

  function showConfirmationUI(data) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('confirm-ui').style.display = 'block';
    document.getElementById('user-info').innerHTML = `
      <strong>Name:</strong> ${data.full_name}<br>
      <strong>Reg ID:</strong> ${regId}<br>
      <strong>Reg Date:</strong> ${data.timestamp || 'N/A'}<br>
      <strong>Status:</strong> ${data.registration_status || 'ACTIVE'}
    `;
  }


  // =====================================================
  // V5A — FIFO WAITLIST PROMOTION ENGINE
  // Queue number is the numeric suffix in stay_allocation_code:
  // ROOM-WAITLIST#n, DORM-WAITLIST#n, OUTSIDE-STAY-WAITLIST#n.
  // Room/Dorm queues are separated by gender; Own Stay has one queue.
  // =====================================================
  function parseQueueNumber(allocationCode) {
    const match = String(allocationCode || "").match(/#(\d+)\s*$/);
    return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
  }

  function getPromotionQueue(allocationCode, gender) {
    const code = String(allocationCode || "").trim().toUpperCase();
    if (code.startsWith("ROOM-WAITLIST")) return { type: "room", gender };
    if (code.startsWith("DORM-WAITLIST")) return { type: "dorm", gender };
    if (code.startsWith("OUTSIDE-STAY-WAITLIST")) return { type: "outside", gender: "all" };
    return null;
  }

  async function promoteFirstWaitlisted(targetEventId, cancelledAllocation, cancelledGender) {
    const cancelledCode = String(cancelledAllocation || "").trim().toUpperCase();
    let queue = null;
    let confirmedCounterPath = "";
    let waitlistCounterPath = "";
    let confirmedPrefix = "";

    if (cancelledCode.includes("ROOM-CONFIRM")) {
      queue = { type: "room", gender: cancelledGender };
      confirmedCounterPath = `counters/confirmed_counters/room_${cancelledGender}/${targetEventId}`;
      waitlistCounterPath = `counters/waitlist_counters/room_${cancelledGender}/${targetEventId}`;
      confirmedPrefix = "ROOM-CONFIRM";
    } else if (cancelledCode.includes("DORM-CONFIRM")) {
      queue = { type: "dorm", gender: cancelledGender };
      confirmedCounterPath = `counters/confirmed_counters/dorm_${cancelledGender}/${targetEventId}`;
      waitlistCounterPath = `counters/waitlist_counters/dorm_${cancelledGender}/${targetEventId}`;
      confirmedPrefix = "DORM-CONFIRM";
    } else if (cancelledCode.includes("OUTSIDE-STAY") && !cancelledCode.includes("WAITLIST")) {
      queue = { type: "outside", gender: "all" };
      confirmedCounterPath = `counters/confirmed_counters/outside_stay/${targetEventId}`;
      waitlistCounterPath = `counters/waitlist_counters/outside_stay/${targetEventId}`;
      confirmedPrefix = "OUTSIDE-STAY-CONFIRM";
    } else {
      return { promoted: false, reason: "CANCELLED_REGISTRATION_WAS_NOT_CONFIRMED" };
    }

    const registrationsSnap = await db.ref(`registrations/${targetEventId}`).once("value");
    const registrations = registrationsSnap.val() || {};
    const candidates = Object.entries(registrations)
      .map(([id, record]) => ({ id, record: record || {} }))
      .filter(item => {
        const code = String(item.record.stay_allocation_code || "").trim().toUpperCase();
        if (!code.includes("WAITLIST")) return false;
        if (queue.type === "outside") return code.startsWith("OUTSIDE-STAY-WAITLIST");
        return code.startsWith(`${queue.type.toUpperCase()}-WAITLIST`) &&
          String(item.record.gender || "").trim().toLowerCase() === queue.gender;
      })
      .sort((a, b) => {
        const qDiff = parseQueueNumber(a.record.stay_allocation_code) - parseQueueNumber(b.record.stay_allocation_code);
        if (qDiff !== 0) return qDiff;
        const aTime = Date.parse(a.record.created_at || a.record.timestamp || "") || 0;
        const bTime = Date.parse(b.record.created_at || b.record.timestamp || "") || 0;
        return aTime - bTime || a.id.localeCompare(b.id);
      });

    if (!candidates.length) {
      return { promoted: false, reason: "NO_MATCHING_WAITLIST_PARTICIPANT", queue: queue.type, gender: queue.gender };
    }

    const selected = candidates[0];
    const participantRef = db.ref(`registrations/${targetEventId}/${selected.id}`);
    const latestSnap = await participantRef.once("value");
    const latest = latestSnap.val();
    if (!latest || String(latest.stay_allocation_code || "").trim().toUpperCase() !==
        String(selected.record.stay_allocation_code || "").trim().toUpperCase()) {
      throw new Error("Waitlist candidate changed during promotion. Please retry after checking the registration.");
    }

    // Move the counters first. A failed transaction aborts promotion.
    const waitlistResult = await db.ref(waitlistCounterPath).transaction(current => Math.max(0, (Number(current) || 0) - 1));
    if (!waitlistResult.committed) throw new Error("Waitlist counter could not be decremented during promotion.");

    let newAllocationCode = "";
    if (queue.type === "outside") {
      const confirmedResult = await db.ref(confirmedCounterPath).transaction(current => (Number(current) || 0) + 1);
      if (!confirmedResult.committed) {
        await db.ref(waitlistCounterPath).transaction(current => (Number(current) || 0) + 1);
        throw new Error("Own Stay confirmed counter could not be incremented during promotion.");
      }
      newAllocationCode = `${confirmedPrefix}#${Number(confirmedResult.snapshot.val()) || 0}`;
    } else {
      const confirmedResult = await db.ref(confirmedCounterPath).transaction(current => (Number(current) || 0) + 1);
      if (!confirmedResult.committed) {
        await db.ref(waitlistCounterPath).transaction(current => (Number(current) || 0) + 1);
        throw new Error("Confirmed accommodation counter could not be incremented during promotion.");
      }
      newAllocationCode = `${confirmedPrefix}#${Number(confirmedResult.snapshot.val()) || 0}`;
    }

    const promotedAt = new Date().toISOString();
    try {
      await participantRef.update({
        stay_allocation_code: newAllocationCode,
        accommodation_promotion_status: "PROMOTED",
        accommodation_promoted_at: promotedAt,
        accommodation_previous_allocation_code: selected.record.stay_allocation_code,
        accommodation_promotion_source: "WAITLIST_FIFO"
      });
    } catch (writeError) {
      // Roll back counter changes if the participant record cannot be updated.
      await db.ref(confirmedCounterPath).transaction(current => Math.max(0, (Number(current) || 0) - 1));
      await db.ref(waitlistCounterPath).transaction(current => (Number(current) || 0) + 1);
      throw writeError;
    }

    console.log("MERS V6A: Waitlist participant promoted", {
      eventId: targetEventId,
      registrationId: selected.id,
      queue: queue.type,
      gender: queue.gender,
      previousAllocation: selected.record.stay_allocation_code,
      newAllocation: newAllocationCode
    });
    return { promoted: true, registrationId: selected.id, queue: queue.type, gender: queue.gender, previousAllocation: selected.record.stay_allocation_code, newAllocation: newAllocationCode };
  }


  // =====================================================
  // V6A — CASCADING RENUMBERING OF CONFIRMED + WAITLIST QUEUES
  // After cancellation/promotion, renumber each queue independently:
  // Confirmed #1..n, then Waitlist #1..m.
  // Room/Dorm queues are gender-specific; Own Stay is one common queue.
  // Only stay_allocation_code changes. Original allocation remains audit history.
  // =====================================================
  async function renumberAccommodationQueue(targetEventId, allocationCode, gender) {
    const code = String(allocationCode || "").trim().toUpperCase();
    let type = "";
    let queueGender = "all";
    let confirmedPrefix = "";
    let waitlistPrefix = "";
    let confirmedCounterPath = "";
    let waitlistCounterPath = "";

    if (code.startsWith("ROOM-")) {
      type = "room";
      queueGender = String(gender || "").trim().toLowerCase();
      confirmedPrefix = "ROOM-CONFIRM";
      waitlistPrefix = "ROOM-WAITLIST";
      confirmedCounterPath = `counters/confirmed_counters/room_${queueGender}/${targetEventId}`;
      waitlistCounterPath = `counters/waitlist_counters/room_${queueGender}/${targetEventId}`;
    } else if (code.startsWith("DORM-")) {
      type = "dorm";
      queueGender = String(gender || "").trim().toLowerCase();
      confirmedPrefix = "DORM-CONFIRM";
      waitlistPrefix = "DORM-WAITLIST";
      confirmedCounterPath = `counters/confirmed_counters/dorm_${queueGender}/${targetEventId}`;
      waitlistCounterPath = `counters/waitlist_counters/dorm_${queueGender}/${targetEventId}`;
    } else if (code.startsWith("OUTSIDE-STAY")) {
      type = "outside";
      confirmedPrefix = "OUTSIDE-STAY-CONFIRM";
      waitlistPrefix = "OUTSIDE-STAY-WAITLIST";
      confirmedCounterPath = `counters/confirmed_counters/outside_stay/${targetEventId}`;
      waitlistCounterPath = `counters/waitlist_counters/outside_stay/${targetEventId}`;
    } else {
      return { renumbered: false, reason: "NOT_AN_ACCOMMODATION_QUEUE" };
    }

    if ((type === "room" || type === "dorm") && !["male", "female"].includes(queueGender)) {
      throw new Error(`Cannot renumber ${type} queue: valid gender is missing.`);
    }

    const snap = await db.ref(`registrations/${targetEventId}`).once("value");
    const all = snap.val() || {};
    const records = Object.entries(all).map(([id, record]) => ({ id, record: record || {} })).filter(item => {
      const current = String(item.record.stay_allocation_code || "").trim().toUpperCase();
      if (type === "outside") {
        const isOwnStay = current.startsWith("OUTSIDE-STAY-CONFIRM") ||
          current.startsWith("OUTSIDE-STAY-WAITLIST") || current === "OUTSIDE-STAY";
        return isOwnStay;
      }
      return (current.startsWith(confirmedPrefix) || current.startsWith(waitlistPrefix)) &&
        String(item.record.gender || "").trim().toLowerCase() === queueGender;
    });

    const sortQueue = (a, b) => {
      const q = parseQueueNumber(a.record.stay_allocation_code) - parseQueueNumber(b.record.stay_allocation_code);
      if (q) return q;
      const at = Date.parse(a.record.created_at || a.record.timestamp || "") || 0;
      const bt = Date.parse(b.record.created_at || b.record.timestamp || "") || 0;
      return at - bt || a.id.localeCompare(b.id);
    };
    const confirmed = records.filter(item => {
      const c = String(item.record.stay_allocation_code || "").trim().toUpperCase();
      return c.startsWith(confirmedPrefix) || (type === "outside" && c === "OUTSIDE-STAY");
    }).sort(sortQueue);
    const waitlisted = records.filter(item =>
      String(item.record.stay_allocation_code || "").trim().toUpperCase().startsWith(waitlistPrefix)
    ).sort(sortQueue);

    const changes = [];
    const applyRenumber = async (items, prefix) => {
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const nextCode = `${prefix}#${i + 1}`;
        const previous = String(item.record.stay_allocation_code || "").trim().toUpperCase();
        if (previous !== nextCode) {
          await db.ref(`registrations/${targetEventId}/${item.id}`).update({ stay_allocation_code: nextCode });
          changes.push({ registrationId: item.id, previousAllocation: previous, newAllocation: nextCode });
        }
      }
    };

    await applyRenumber(confirmed, confirmedPrefix);
    await applyRenumber(waitlisted, waitlistPrefix);

    // Counters are reconciled to the actual active records in these two queues.
    const counterUpdates = {};
    counterUpdates[confirmedCounterPath] = confirmed.length;
    counterUpdates[waitlistCounterPath] = waitlisted.length;
    await db.ref().update(counterUpdates);

    const result = {
      renumbered: true,
      queue: type,
      gender: queueGender,
      confirmedCount: confirmed.length,
      waitlistCount: waitlisted.length,
      changes
    };
    console.log("MERS V6A: Cascading accommodation queue renumbering", result);
    return result;
  }

async function handleResponse(choice) {

  document.getElementById('confirm-ui').style.display = 'none';
  document.getElementById('loader').innerText = "Processing...";
  document.getElementById('loader').style.display = 'block';

  if (choice === 'NO') {

    showFinalStatus(
      "Stay with us!",
      "Thank you for staying with us...",
      "😊"
    );

    return;
  }

  try {

    const snapshot = await db.ref(
      `registrations/${eventId}/${regId}`
    ).once('value');

    const data = snapshot.val();

    if (!data) throw new Error("Registration record was not found.");
    // V16 registration records use stay_allocation_code as the authoritative
    // accommodation allocation marker. registration_status is a timestamp label,
    // not the literal value CONFIRMED / ROOM WL / DORM WL.
    const allocationCode = String(data.stay_allocation_code || data.original_stay_allocation_code || "").trim().toUpperCase();
    const gender = String(data.gender || "").trim().toLowerCase();
    if (!gender || !["male", "female"].includes(gender)) {
      throw new Error("The registration has no valid gender. Counters were not changed.");
    }

    // Prevent accidental second decrement if the cancellation page is retried.
    const alreadyDeleted = await db.ref(`deleted_registrations/${eventId}/${regId}`).once('value');
    if (alreadyDeleted.exists()) {
      showFinalStatus("Already Cancelled", "This registration has already been cancelled.", "ℹ️");
      return;
    }

    // Determine the accommodation counter before changing any counters.
    let accommodationCounterPath = "";
    if (allocationCode.includes("ROOM-CONFIRM")) {
      accommodationCounterPath = `counters/confirmed_counters/room_${gender}/${eventId}`;
    } else if (allocationCode.includes("DORM-CONFIRM")) {
      accommodationCounterPath = `counters/confirmed_counters/dorm_${gender}/${eventId}`;
    } else if (allocationCode.includes("ROOM-WAITLIST")) {
      accommodationCounterPath = `counters/waitlist_counters/room_${gender}/${eventId}`;
    } else if (allocationCode.includes("DORM-WAITLIST")) {
      accommodationCounterPath = `counters/waitlist_counters/dorm_${gender}/${eventId}`;
    } else if (!allocationCode.includes("OUTSIDE-STAY")) {
      throw new Error("The registration's stay_allocation_code is missing or unrecognised. No accommodation counter was changed.");
    }

    // Release the total active-registration count. Do NOT decrement
    // counters/{eventId}: that node is the sequential registration-ID generator.
    const activeResult = await db.ref(`active_seats/${eventId}`).transaction(current => Math.max(0, (Number(current) || 0) - 1));
    if (!activeResult.committed) throw new Error("Active registration counter could not be decremented.");

    if (accommodationCounterPath) {
      const counterResult = await db.ref(accommodationCounterPath).transaction(current => Math.max(0, (Number(current) || 0) - 1));
      if (!counterResult.committed) throw new Error("Accommodation counter could not be decremented.");
    }

    if (allocationCode.includes("OUTSIDE-STAY-WAITLIST")) {
      const outsideWaitlistResult = await db.ref(`counters/waitlist_counters/outside_stay/${eventId}`).transaction(current => Math.max(0, (Number(current) || 0) - 1));
      if (!outsideWaitlistResult.committed) throw new Error("Own-stay waitlist counter could not be decremented.");
    } else if (allocationCode.includes("OUTSIDE-STAY")) {
      await db.ref(`counters/outside_stay_cancellations/${eventId}`).transaction(current => (Number(current) || 0) + 1);
      const outsideResult = await db.ref(`counters/confirmed_counters/outside_stay/${eventId}`).transaction(current => Math.max(0, (Number(current) || 0) - 1));
      if (!outsideResult.committed) throw new Error("Own-stay counter could not be decremented.");
    }

    // Record confirmed Room/Dorm cancellations after the combined waitlist
    // reached its configured limit. This is an audit counter only; it never
    // reopens waitlist choices or a permanently closed registration form.
    const controlSnap = await db.ref(`registration_control/${eventId}`).once("value");
    const control = controlSnap.val() || {};
    if (control.waitlist_choices_suspended === true &&
        (allocationCode.includes("ROOM-CONFIRM") || allocationCode.includes("DORM-CONFIRM"))) {
      await db.ref(`counters/confirmed_cancellations_after_waitlist_suspended/${eventId}`)
        .transaction(current => (Number(current) || 0) + 1);
    }

    // If all registrations have been cancelled, reset the post-suspension
    // cancellation counter as agreed. Registration closure itself is not reversed.
    if ((Number(activeResult.snapshot.val()) || 0) === 0) {
      await db.ref(`counters/confirmed_cancellations_after_waitlist_suspended/${eventId}`).set(0);
      await db.ref(`registration_control/${eventId}/waitlist_choices_suspended`).set(false);
    }

    // Promote the earliest participant from the matching FIFO waitlist.
    // A waitlisted cancellation does not create a vacancy and therefore does
    // not trigger promotion. Room/Dorm queues remain separate by gender/type;
    // Own Stay uses one common queue.
    const promotionResult = await promoteFirstWaitlisted(eventId, allocationCode, gender);
    console.log("MERS V6A: Promotion result", promotionResult);

    // Recalculate all four available-seat values from Event_Config and the
    // confirmed counters, including VIP/facilitator room reservations.
    await recalculateAvailableSeatsForCancellation(eventId);

    data.registration_status = "CANCELLED";
    data.cancelled_at = new Date().toLocaleString();
    data.waitlist_promotion_result = promotionResult;
    await db.ref(`deleted_registrations/${eventId}/${regId}`).set(data);
    await db.ref(`registrations/${eventId}/${regId}`).remove();

    // Renumber BOTH confirmed and waitlist allocations after cancellation/promotion.
    // If this maintenance step fails after the cancellation is committed, do not
    // report the cancellation itself as failed; log the repair requirement clearly.
    let renumberResult = null;
    let renumberError = null;
    try {
      renumberResult = await renumberAccommodationQueue(eventId, allocationCode, gender);
      console.log("MERS V6A: Post-cancellation cascading queue update", renumberResult);
    } catch (queueError) {
      renumberError = queueError;
      console.error("MERS V6A: Cancellation completed, but queue renumbering needs attention", queueError);
    }

    // =====================================================
    // SUCCESS MESSAGE
    // =====================================================

    showFinalStatus(
      "Cancelled",
      renumberError
        ? "Your cancellation is recorded. The accommodation queue needs a coordinator review; please contact the event team."
        : "Thank you for cancellation... your seat is released now for others...",
      renumberError ? "⚠️" : "✅"
    );

  } catch (e) {

    console.error(e);

    showFinalStatus(
      "Error",
      "Process failed.",
      "❌"
    );

  }

}


  function showFinalStatus(title, desc, icon) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('confirm-ui').style.display = 'none';
    document.getElementById('status-ui').style.display = 'block';
    
    document.getElementById('status-title').innerText = title;
    document.getElementById('status-desc').innerText = desc;
    document.getElementById('status-icon').innerText = icon;

    startCountdown();
  }

  function startCountdown() {
    let timeLeft = 15;
    const timerElement = document.getElementById('countdown');
    const interval = setInterval(() => {
      timeLeft--;
      timerElement.innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(interval);
        window.close();
      }
    }, 1000);
  }
</script>
